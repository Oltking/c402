# Keeps the free Render c402 endpoint awake: pings /health every ~10 min so it doesn't
# spin down after 15 min of no traffic (a sleeping service can't wake itself).
#
# Setup: in the repo, add a variable named C402_ENDPOINT_URL pointing at the Render URL
# (Settings -> Secrets and variables -> Actions -> Variables). If unset, this no-ops.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.C402_ENDPOINT_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "C402_ENDPOINT_URL not set - skipping keep-alive."
            exit 0
          fi
          echo "Pinging $URL/health"
          curl -fsS --max-time 60 "$URL/health" && echo "\nawake" || echo "ping failed (endpoint may be cold-starting)"
